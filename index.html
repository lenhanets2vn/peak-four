    <script>
      // Defensive setter patch for environments where window.fetch has only a getter
      (function() {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : null;
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch') ||
                     (window.Window && Object.getOwnPropertyDescriptor(window.Window.prototype, 'fetch'));
          if (!desc || !desc.set || !desc.writable) {
            Object.defineProperty(window, 'fetch', {
              get: function() { return originalFetch; },
              set: function(fn) { originalFetch = fn; },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          // Ignore patch failures
        }
      })();
    </script>
